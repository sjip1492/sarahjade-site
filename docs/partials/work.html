<div class="blog-container rounded blur unblur-hover">
  <h2 class="content-header">Recent Work</h2>
  {% assign news = site.posts | where:"tags","work"  %}
  {% for post in news %}
    <div class="blog-preview">
      <p><b><a href="{{ post.url }}">{{ post.date | date: "%-d %B %Y" }}</a></b> {{ post.title }}</p>
    </div>
  {% endfor %}
  <p><a href="{{ '/work_index.html' | relative_url }}" target="_self">See all</a></p>

</div>
