---
title: "All News"
---
<div class="content-container blur rounded">
  <span class="blur-bg" aria-hidden="true"></span>
  <div class="blur-fg">
    <h2 class="content-header">{{ page.title }}</h2>
    <span class="post-date">{{ page.date | date: "%B %-d, %Y" }}</span>
    <ul>
      {% for post in site.posts %}
        {% if post.tags contains 'news' %}
          <li>
            <a href="{{ post.url }}">{{ post.title }}</a> - {{ post.date | date: "%B %d, %Y" }}
          </li>
        {% endif %}
      {% endfor %}
    </ul>
  </div>
</div>
